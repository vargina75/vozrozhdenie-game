                    examples: [

                    ],
                    painting: {

                    },
                    info: "Важно понять: полифоническая техника Возрождения достигла невероятной сложности.",

                    examples: [
                        "Жанры, которые обретут совершенную форму в эпоху барокко: прелюдии, фантазии, вариации, токкаты",

            },
            {
                id: 5,
                title: "Музыка в образовании",
                shortDesc: "Томас Морли и музыкальная культура общества",
                content: {

                    examples: [

                        "Этот случай свидетельствует об уровне музыкальной культуры широких слоёв общества в Англии того времени",
                        "Множество живописных полотен, на которых изображены музицирующие люди эпохи Возрождения, подтверждают всеобщее увлечение музыкой"
                    ],
                    painting: {
                        title: "Хоровая книга",
                        author: "Италия, Флоренция, около 1380 года",
                        description: "Хоровая книга из Флоренции для исполнения духовной музыки.",
                        url: "painting4.jpg"
                    },
                    errors: [
                        "Ошибка: думать, что музыка была только для профессионалов",
                        "Ошибка: считать, что нотная грамота была редкостью. Наоборот — незнание нот считалось позором для образованного человека"
                    ]
                }
            }
        ];

        const testQuestions = [
            {
                question: "Эпоха Возрождения охватывает период ________ веков.",
                answers: ["X–XII", "XIV–XVI", "XVII–XVIII"],
                correct: 1,
                hint: "Эпоха началась в 1300-х годах"
            },
            {
                question: "Скульптуру «Моисей» создал ________.",
                answers: ["Рафаэль", "Леонардо", "Микеланджело"],
                correct: 2,
                hint: "Этот мастер был также поэтом"
            },
            {
                question: "«Сикстинская Мадонна» — произведение ________.",
                answers: ["Рафаэля", "Боттичелли", "Дюрера"],
                correct: 0,
                hint: "Младший современник Микеланджело"
            },
            {
                question: "«Божественная комедия» — произведение ________.",
                answers: ["Данте", "Боттичелли", "Микеланджело"],
                correct: 0,
                hint: "Литературное произведение"
            },
            {
                question: "Пение без инструментов называется ________.",
                answers: ["a cappella", "мотет", "токката"],
                correct: 0,
                hint: "«Как в капелле»"
            },
            {
                question: "Великий итальянский композитор полифонии — ________.",
                answers: ["Машо", "Депре", "Палестрина"],
                correct: 2,
                hint: "Итальянец"
            },
            {
                question: "Жанры барокко: прелюдии, фантазии, вариации и ________.",
                answers: ["сонаты", "токкаты", "симфонии"],
                correct: 1,
                hint: "Виртуозное произведение"
            },
            {
                question: "Инструменты Возрождения: флейта, виола и ________.",
                answers: ["фортепиано", "лютня", "скрипка"],
                correct: 1,
                hint: "Предшественник гитары"
            },
            {
                question: "В Средневековье в музыке господствовал ________.",
                answers: ["орган", "клавесин", "арфа"],
                correct: 0,
                hint: "Клавишный духовой инструмент"
            },
            {
                question: "Учебник музыки 1597 года написал ________.",
                answers: ["Машо", "Морли", "Депре"],
                correct: 1,
                hint: "Англичанин 1557–1603"
            }
        ];

        let visitedElements = new Set();
        let timerInterval;
        let seconds = 0;

        function init() {
            renderElements();
            updateProgress();
        }

        function renderElements() {
            const grid = document.getElementById('elements-grid');
            grid.innerHTML = '';
            
            elements.forEach(el => {
                const btn = document.createElement('div');
                btn.className = 'element-btn';
                btn.id = `element-${el.id}`;
                btn.innerHTML = `
                    <h3>${el.title}</h3>
                    <p>${el.shortDesc}</p>
                `;
                btn.onclick = () => openCard(el);
                grid.appendChild(btn);
            });
        }

        function openCard(element) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            
            let infoHtml = '';
            if (element.content.info) {
                infoHtml = `
                    <h3>Важно понять</h3>
                    <div class="info-box">${element.content.info}</div>
                `;
            }

            let quoteHtml = '';
            if (element.content.quote) {
                quoteHtml = `
                    <div class="quote-box">
                        <div class="quote-text">${element.content.quote.text}</div>
                        <div class="quote-author">— ${element.content.quote.author}</div>
                    </div>
                `;
            }

            let paintingsHtml = '';
            if (element.content.paintings) {
                paintingsHtml = `
                    <div class="paintings-grid">
                        ${element.content.paintings.map(p => `
                            <div class="painting-item">
                                <div class="painting-item-inner">
                                    <img src="${p.url}" alt="${p.title}" 
                                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                    <div class="painting-fallback" style="display:none;">
                                        <div class="painting-fallback-title">${p.title}</div>
                                        <div class="painting-fallback-author">${p.author}</div>
                                        <div class="painting-fallback-desc">${p.description}</div>
                                    </div>
                                </div>
                                <div class="painting-item-caption">${p.title} — ${p.author}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (element.content.painting) {
                const p = element.content.painting;
                paintingsHtml = `
                    <div class="painting-frame">
                        <div class="painting-inner">
                            <img class="painting-img" src="${p.url}" alt="${p.title}" 
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="painting-fallback" style="display:none;">
                                <div class="painting-fallback-title">${p.title}</div>
                                <div class="painting-fallback-author">${p.author}</div>
                                <div class="painting-fallback-desc">${p.description}</div>
                            </div>
                        </div>
                    </div>
                    <div class="painting-caption">${p.title} — ${p.author}</div>
                `;
            }
            
            content.innerHTML = `
                <h2>${element.title}</h2>
                ${paintingsHtml}
                <h3>Что это такое?</h3>
                <p>${element.content.definition}</p>
                
                <h3>Примеры</h3>
                ${element.content.examples.map(ex => `
                    <div class="example-box">${ex}</div>
                `).join('')}
                
                ${quoteHtml}
                ${infoHtml}
                
                <h3>Типичные ошибки</h3>
                ${element.content.errors.map(err => `
                    <div class="error-box">${err}</div>
                `).join('')}
                
                <button class="close-btn" onclick="closeCard(${element.id})">Понял!</button>
            `;
            
            modal.style.display = 'block';
            visitedElements.add(element.id);
            
            const elementBtn = document.getElementById(`element-${element.id}`);
            if (elementBtn) {
                elementBtn.classList.add('visited');
            }
            
            updateProgress();
        }

        function closeCard(elementId) {
            document.getElementById('modal').style.display = 'none';
            checkTestAvailability();
        }

        function updateProgress() {
            const progress = visitedElements.size;
            const total = elements.length;
            document.getElementById('progress-text').textContent = `${progress}/${total}`;
            document.getElementById('progress-fill').style.width = `${(progress / total) * 100}%`;
        }

        function checkTestAvailability() {
            const testBtn = document.getElementById('test-btn');
            if (visitedElements.size === elements.length) {
                testBtn.disabled = false;
            }
        }

        document.getElementById('test-btn').onclick = function() {
            document.getElementById('elements-grid').style.display = 'none';
            document.querySelector('.test-btn-container').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            document.getElementById('test-container').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            
            startTimer();
            renderTest();
        };

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer-value').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function renderTest() {
            const container = document.getElementById('test-container');
            container.innerHTML = '<h2 style="font-family: Playfair Display; color: #5c3a21; margin-bottom: 35px; text-align: center; font-size: 2.4rem; border-bottom: 3px solid #c9a96e; padding-bottom: 15px; font-style: italic;">Тест по эпохе Возрождения</h2>';
            
            testQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="question-text">
                        <strong>Вопрос ${index + 1}:</strong> ${q.question}
                    </div>
                    <div class="answers">
                        ${q.answers.map((ans, ansIndex) => `
                            <div class="answer-option" onclick="selectAnswer(${index}, ${ansIndex})">
                                ${ans}
                            </div>
                        `).join('')}
                    </div>
                    <button class="hint-btn" onclick="showHint(${index})">Подсказка</button>
                    <div class="hint-text" id="hint-${index}">${q.hint}</div>
                `;
                container.appendChild(questionDiv);
            });
            
            const submitBtn = document.createElement('button');
            submitBtn.className = 'submit-test-btn';
            submitBtn.textContent = 'Проверить ответы';
            submitBtn.onclick = checkAnswers;
            container.appendChild(submitBtn);
        }

        function selectAnswer(questionIndex, answerIndex) {
            const question = document.querySelectorAll('.question')[questionIndex];
            const options = question.querySelectorAll('.answer-option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[answerIndex].classList.add('selected');
            options[answerIndex].dataset.selected = 'true';
        }

        function showHint(index) {
            document.getElementById(`hint-${index}`).style.display = 'block';
        }

        function checkAnswers() {
            clearInterval(timerInterval);
            let correct = 0;
            const total = testQuestions.length;
            
            testQuestions.forEach((q, index) => {
                const question = document.querySelectorAll('.question')[index];
                const options = question.querySelectorAll('.answer-option');
                let selected = -1;
                
                options.forEach((opt, optIndex) => {
                    if (opt.dataset.selected === 'true') {
                        selected = optIndex;
                    }
                    opt.onclick = null;
                });
                
                if (selected === q.correct) {
                    correct++;
                    options[selected].classList.add('correct');
                } else {
                    if (selected !== -1) {
                        options[selected].classList.add('incorrect');
                    }
                    options[q.correct].classList.add('correct');
                }
            });
            
            setTimeout(() => showResults(correct, total), 1500);
        }

        function showResults(correct, total) {
            document.getElementById('test-container').style.display = 'none';
            document.getElementById('timer').style.display = 'none';
            const results = document.getElementById('results');
            results.style.display = 'block';
            
            if (correct === total) {
                results.className = 'results success';
                results.innerHTML = `
                    <h2>Отлично!</h2>
                    <p>Ты настоящий знаток эпохи Возрождения!</p>
                    <p>Правильных ответов: ${correct} из ${total}</p>
                    <button class="restart-btn" onclick="restart()">Вернуться к карточкам</button>
                `;
                createConfetti();
            } else {
                results.className = 'results failure';
                results.innerHTML = `
                    <h2>Почти получилось!</h2>
                    <p>Перечитай карточки и попробуй снова!</p>
                    <p>Правильных ответов: ${correct} из ${total}</p>
                    <button class="restart-btn" onclick="restart()">Вернуться к карточкам</button>
                    <button class="restart-btn" onclick="retakeTest()">Пройти тест снова</button>
                `;
            }
        }

        function createConfetti() {
            const colors = ['#c9a96e', '#a07840', '#6b8e23', '#cd853f', '#8b7355'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        function restart() {
            visitedElements.clear();
            seconds = 0;
            document.getElementById('results').style.display = 'none';
            document.getElementById('elements-grid').style.display = 'grid';
            document.querySelector('.test-btn-container').style.display = 'block';
            document.querySelector('.progress-container').style.display = 'block';
            document.getElementById('test-btn').disabled = true;
            renderElements();
            updateProgress();
        }

        function retakeTest() {
            seconds = 0;
            document.getElementById('results').style.display = 'none';
            document.getElementById('test-container').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            startTimer();
            renderTest();
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        init();
    </script>
</body>
</html>
